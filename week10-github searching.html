<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub ユーザー情報検索ツール</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <main class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md">
    <h1 class="text-xl font-bold text-gray-800 text-center mb-6">GitHub ユーザー検索</h1>

    <!-- 検索フォーム -->
    <form id="searchForm" class="flex gap-2 mb-6">
      <input
        type="text"
        id="usernameInput"
        required
        placeholder="GitHubユーザー名 (例: octocat)"
        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
      >
      <button
        type="submit"
        id="searchBtn"
        class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition disabled:opacity-50"
      >
        検索
      </button>
    </form>

    <!-- ローディング表示（初期状態は非表示） -->
    <div id="loading" class="hidden text-center py-6 text-gray-500 font-medium animate-pulse text-sm">
      読み込み中...
    </div>

    <!-- エラーメッセージ表示枠（初期状態は非表示） -->
    <div id="errorMessage" class="hidden text-center py-4 text-red-500 font-medium text-sm bg-red-50 rounded-lg border border-red-200"></div>

    <!-- ユーザー情報表示カード（初期状態は非表示） -->
    <div id="userCard" class="hidden border border-gray-200 rounded-xl p-5 bg-gray-50">
      <div class="flex items-center gap-4 mb-4">
        <!-- アバター画像 -->
        <img id="avatar" src="" alt="アバター画像" class="w-16 h-16 rounded-full border border-gray-300 shadow-sm object-cover">
        <div class="overflow-hidden">
          <!-- 氏名 -->
          <h2 id="name" class="font-bold text-gray-900 text-lg leading-tight truncate"></h2>
          <!-- ユーザーID -->
          <p id="login" class="text-sm text-gray-500"></p>
        </div>
      </div>

      <!-- 自己紹介（bio） -->
      <p id="bio" class="text-gray-700 text-sm mb-4 leading-relaxed break-words"></p>

      <!-- カウント情報（フォロワー数・リポジトリ数） -->
      <div class="flex justify-around bg-white border border-gray-200 rounded-lg py-2.5 mb-4 text-center">
        <div>
          <span class="block text-xs text-gray-500 font-medium">フォロワー</span>
          <span id="followers" class="text-base font-bold text-gray-800">0</span>
        </div>
        <div class="border-r border-gray-200"></div>
        <div>
          <span class="block text-xs text-gray-500 font-medium">公開リポジトリ</span>
          <span id="repos" class="text-base font-bold text-gray-800">0</span>
        </div>
      </div>

      <!-- プロフィールリンク -->
      <a
        id="profileLink"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        class="block text-center bg-gray-900 hover:bg-gray-800 text-white text-sm font-semibold py-2 rounded-lg transition"
      >
        GitHubで開く
      </a>
    </div>
  </main>

  <script>
    const searchForm = document.getElementById("searchForm");
    const usernameInput = document.getElementById("usernameInput");
    const searchBtn = document.getElementById("searchBtn");

    const loading = document.getElementById("loading");
    const errorMessage = document.getElementById("errorMessage");
    const userCard = document.getElementById("userCard");

    const avatar = document.getElementById("avatar");
    const nameEl = document.getElementById("name");
    const loginEl = document.getElementById("login");
    const bioEl = document.getElementById("bio");
    const followersEl = document.getElementById("followers");
    const reposEl = document.getElementById("repos");
    const profileLink = document.getElementById("profileLink");

    searchForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = usernameInput.value.trim();
      if (!username) return;

      // 画面状態のリセットとローディング開始
      setLoading(true);
      hideError();
      userCard.classList.add("hidden");

      try {
        const response = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}`);

        // 通信成否チェック
        if (!response.ok) {
          if (response.status === 404) {
            showError("ユーザーが見つかりませんでした");
          } else {
            showError(`情報の取得に失敗しました (Status: ${response.status})`);
          }
          return;
        }

        const data = await response.json();
        console.log("GitHub API レスポンス:", data);

        // 画面へのデータ反映
        renderUser(data);

      } catch (error) {
        console.error("通信エラー:", error);
        showError("ネットワークエラーが発生しました。接続を確認してください。");
      } finally {
        // 通信完了後にローディング解除
        setLoading(false);
      }
    });

    // 取得したデータを各要素へ流し込む
    function renderUser(user) {
      avatar.src = user.avatar_url;
      avatar.alt = `${user.login}のアバター`;
      nameEl.textContent = user.name || user.login;
      loginEl.textContent = `@${user.login}`;
      bioEl.textContent = user.bio || "自己紹介文は設定されていません。";
      followersEl.textContent = user.followers.toLocaleString();
      reposEl.textContent = user.public_repos.toLocaleString();
      profileLink.href = user.html_url;

      userCard.classList.remove("hidden");
    }

    // ローディング状態の制御
    function setLoading(isLoading) {
      if (isLoading) {
        loading.classList.remove("hidden");
        searchBtn.disabled = true;
      } else {
        loading.classList.add("hidden");
        searchBtn.disabled = false;
      }
    }

    // エラー表示の制御
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove("hidden");
    }

    function hideError() {
      errorMessage.classList.add("hidden");
      errorMessage.textContent = "";
    }
  </script>
</body>
</html>
